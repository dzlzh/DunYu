name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
        env:
          DUNYU_UI_SCREENSHOTS: '1'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem target/ui-preview/*.bmp | ForEach-Object {
            $bitmap = [System.Drawing.Bitmap]::FromFile($_.FullName)
            try { $bitmap.Save([System.IO.Path]::ChangeExtension($_.FullName, '.png'), [System.Drawing.Imaging.ImageFormat]::Png) }
            finally { $bitmap.Dispose() }
          }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DunYu-ui-preview
          path: target/ui-preview/*.png
          if-no-files-found: error
      - run: cargo clippy --all-targets
      - if: runner.os == 'Windows'
        run: cargo build --locked --release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item dist/DunYu -ItemType Directory -Force
          Copy-Item target/release/dunyu.exe,README.md,docs/USAGE.md dist/DunYu
          Compress-Archive dist/DunYu dist/DunYu-windows-x64.zip
          (Get-FileHash dist/DunYu-windows-x64.zip -Algorithm SHA256).Hash + '  DunYu-windows-x64.zip' | Set-Content dist/SHA256SUMS.txt
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DunYu-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            Cargo.lock
