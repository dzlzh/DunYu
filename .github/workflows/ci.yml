name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/asset-requirements.txt
      - run: python scripts/prepare-assets.py --check
      - run: cargo fmt --all -- --check
      - if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/run-ui-diagnostics.ps1 -SelfTest
      - run: cargo test --locked --all-targets
        env:
          DUNYU_UI_SCREENSHOTS: '1'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem target/ui-preview/*.bmp | ForEach-Object {
            $bitmap = [System.Drawing.Bitmap]::FromFile($_.FullName)
            try { $bitmap.Save([System.IO.Path]::ChangeExtension($_.FullName, '.png'), [System.Drawing.Imaging.ImageFormat]::Png) }
            finally { $bitmap.Dispose() }
          }
      - if: runner.os == 'Windows'
        run: python scripts/compare-ui.py
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DunYu-ui-preview
          path: |
            target/ui-preview/*.png
            target/ui-preview/comparison.json
          if-no-files-found: error
      - run: cargo clippy --all-targets
      - if: runner.os == 'Windows'
        run: cargo build --locked --release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item dist/DunYu -ItemType Directory -Force
          Copy-Item target/release/dunyu.exe dist/DunYu
          Copy-Item target/release/dunyu.exe dist/dunyu.exe
          Copy-Item LICENSE dist/DunYu/LICENSE
          Copy-Item LICENSE dist/LICENSE
          Copy-Item resources/fonts/OFL.txt dist/DunYu/OFL.txt
          Copy-Item resources/fonts/OFL.txt dist/OFL.txt
          Compress-Archive dist/DunYu dist/DunYu-windows-x64.zip
          Get-Item dist/dunyu.exe, dist/DunYu-windows-x64.zip | Select-Object Name, Length | Format-Table | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
          @('DunYu-windows-x64.zip', 'dunyu.exe') | ForEach-Object { (Get-FileHash (Join-Path dist $_) -Algorithm SHA256).Hash + '  ' + $_ } | Set-Content dist/SHA256SUMS.txt
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DunYu-windows-x64
          path: |
            dist/*.zip
            dist/dunyu.exe
            dist/SHA256SUMS.txt
            dist/OFL.txt
            dist/LICENSE
            Cargo.lock
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-ui-diagnostics.ps1
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DunYu-ui-diagnostics
          path: target/DunYu-ui-diagnostics.zip
          if-no-files-found: error
